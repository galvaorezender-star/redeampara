<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Plataforma Formatura 2026 · Sistema Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f8;
            color: #0b1a33;
            padding: 28px 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }

        .app {
            max-width: 1480px;
            width: 100%;
        }

        /* ============================================================
           HEADER PREMIUM
           ============================================================ */
        .header {
            background: linear-gradient(145deg, #0b1a33 0%, #1e3a6b 100%);
            border-radius: 32px;
            padding: 28px 36px;
            margin-bottom: 28px;
            box-shadow: 0 20px 48px -12px rgba(11, 26, 51, 0.35);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 215, 0, 0.12);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: "✦";
            position: absolute;
            right: 20px;
            top: -30px;
            font-size: 180px;
            color: rgba(255, 215, 0, 0.035);
            pointer-events: none;
            transform: rotate(12deg);
        }

        .header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #fbbf24, #f59e0b, transparent);
            opacity: 0.3;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 1;
        }

        .header-left .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-left .logo-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 215, 0, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        .header-left h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #ffffff;
        }

        .header-left h1 span {
            color: #fcd34d;
            font-weight: 500;
        }

        .header-left .subtitle {
            color: #b9c8e0;
            font-size: 0.9rem;
            font-weight: 400;
            margin-left: 58px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1;
            flex-wrap: wrap;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            padding: 10px 22px;
            border-radius: 60px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            color: #facc15;
            font-weight: 500;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-badge .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }

        /* ============================================================
           COUNTDOWN GLOBAL - DESTAQUE
           ============================================================ */
        .countdown-global {
            background: linear-gradient(145deg, #0b1a33 0%, #1e3a6b 100%);
            border-radius: 24px;
            padding: 18px 28px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 215, 0, 0.12);
            box-shadow: 0 8px 32px rgba(11, 26, 51, 0.15);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .countdown-global::before {
            content: "⏳";
            position: absolute;
            right: -10px;
            top: -30px;
            font-size: 140px;
            opacity: 0.04;
            pointer-events: none;
        }

        .countdown-global .label {
            color: #b9c8e0;
            font-size: 0.9rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .countdown-global .label strong {
            color: #fcd34d;
            font-weight: 600;
        }

        .countdown-global .display {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .countdown-global .item {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 8px 14px;
            text-align: center;
            min-width: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .countdown-global .item .number {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fcd34d;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .countdown-global .item .label-small {
            font-size: 0.55rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .countdown-global .separator {
            color: #fcd34d;
            font-size: 1.8rem;
            font-weight: 300;
            opacity: 0.3;
            margin: 0 -2px;
        }

        .countdown-global .date-info {
            color: #94a3b8;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .countdown-global .date-info strong {
            color: #fcd34d;
            font-weight: 500;
        }

        /* ============================================================
           TABS NAV
           ============================================================ */
        .tabs-nav {
            display: flex;
            gap: 6px;
            background: #ffffff;
            border-radius: 20px;
            padding: 6px;
            margin-bottom: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #e8edf5;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 180px;
            padding: 14px 28px;
            border: none;
            background: transparent;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
        }

        .tab-btn:hover {
            background: #f1f4f9;
            color: #0b1a33;
        }

        .tab-btn.active {
            background: #0b1a33;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(11, 26, 51, 0.2);
        }

        .tab-btn .icon {
            font-size: 1.2rem;
        }

        /* ============================================================
           TAB CONTENT
           ============================================================ */
        .tab-content {
            display: none;
            animation: fadeSlide 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           DASHBOARD CARDS
           ============================================================ */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 32px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 22px 24px 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            border: 1px solid #e8edf5;
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px -8px rgba(11, 26, 51, 0.08);
            border-color: #d0dcec;
        }

        .card-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b1a33;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .card-value small {
            font-size: 0.8rem;
            font-weight: 400;
            color: #64748b;
        }

        .card-value .pill {
            background: #dcfce7;
            color: #166534;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            border: 1px solid #bbf7d0;
        }

        /* ============================================================
           SEARCH
           ============================================================ */
        .search-bar {
            margin-bottom: 24px;
            display: flex;
            justify-content: flex-end;
        }

        .search-wrapper {
            position: relative;
            width: 320px;
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 20px 12px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            font-size: 0.95rem;
            background: #ffffff;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            color: #0b1a33;
            font-family: 'Inter', sans-serif;
        }

        .search-wrapper input::placeholder {
            color: #94a3b8;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: #1e3a6b;
            box-shadow: 0 4px 20px rgba(30, 58, 107, 0.08);
        }

        .search-wrapper .icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: #94a3b8;
            pointer-events: none;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.02);
            border: 1px solid #e8edf5;
            overflow: hidden;
            max-height: 560px;
            overflow-y: auto;
            overflow-x: auto;
        }

        .table-container::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #f0f2f8;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.85rem;
            min-width: 1150px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        thead th {
            background: #f8fafc;
            padding: 16px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        thead th:first-child {
            padding-left: 24px;
            min-width: 220px;
        }

        thead th:last-child {
            padding-right: 24px;
        }

        thead th .highlight-trote {
            color: #1e40af;
            background: #eff6ff;
            padding: 2px 12px;
            border-radius: 12px;
        }

        thead th .highlight-rifa {
            color: #92400e;
            background: #fffbeb;
            padding: 2px 12px;
            border-radius: 12px;
        }

        tbody tr {
            border-bottom: 1px solid #f1f4f9;
            transition: background 0.15s ease;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #fafbfd;
        }

        tbody td {
            padding: 14px 14px;
            vertical-align: middle;
            color: #1e293b;
            border-bottom: 1px solid #f1f4f9;
            text-align: center;
        }

        tbody td:first-child {
            font-weight: 500;
            padding-left: 24px;
            color: #0b1a33;
            text-align: left;
        }

        tbody td:last-child {
            padding-right: 24px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 40px;
            font-size: 1rem;
            background: transparent;
            transition: 0.1s ease;
        }

        .status-badge.pago {
            background: #dcfce7;
            color: #15803d;
        }

        .status-badge.nao-pago {
            background: #fee2e2;
            color: #b91c1c;
        }

        .col-trote {
            background: #eff6ff;
            border-radius: 6px;
        }

        .col-rifa {
            background: #fffbeb;
            border-radius: 6px;
        }

        td.col-trote,
        td.col-rifa {
            text-align: center;
            padding: 8px 6px;
        }

        /* Alertas */
        tr.alerta-3-meses {
            background-color: #fef9e7 !important;
            border-left: 4px solid #f59e0b;
        }

        tr.alerta-3-meses:hover {
            background-color: #fef3c7 !important;
        }

        tr.alerta-4-meses {
            background-color: #fee2e2 !important;
            border-left: 4px solid #dc2626;
            opacity: 0.85;
        }

        tr.alerta-4-meses:hover {
            background-color: #fecaca !important;
        }

        tr.alerta-4-meses td:first-child::after {
            content: " 🚫";
            font-size: 0.85rem;
            opacity: 0.6;
        }

        /* ============================================================
           INFORMAÇÕES - Layout Refinado
           ============================================================ */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 28px;
        }

        .info-main {
            background: #ffffff;
            border-radius: 28px;
            padding: 36px;
            border: 1px solid #e8edf5;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.02);
        }

        .info-main .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0b1a33;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-main .section-subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f1f4f9;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid #f1f4f9;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-item .emoji-box {
            width: 44px;
            height: 44px;
            background: #f1f4f9;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .info-item .content {
            flex: 1;
        }

        .info-item .content .label {
            font-weight: 600;
            color: #0b1a33;
            font-size: 0.9rem;
        }

        .info-item .content .value {
            color: #475569;
            font-size: 0.95rem;
            margin-top: 2px;
        }

        .info-item .content .value .highlight {
            color: #1e3a6b;
            font-weight: 600;
        }

        .info-item .content .badge {
            display: inline-block;
            background: #eff6ff;
            color: #1e40af;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            margin-left: 8px;
        }

        .info-item .content .badge-gold {
            background: #fef9e7;
            color: #92400e;
        }

        .info-item .content ul {
            list-style: none;
            padding: 0;
            margin-top: 6px;
        }

        .info-item .content ul li {
            padding: 4px 0;
            color: #475569;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-item .content ul li::before {
            content: "•";
            color: #1e3a6b;
            font-weight: 700;
        }

        /* Sidebar */
        .info-side {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .side-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 28px;
            border: 1px solid #e8edf5;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .side-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        .side-card .icon-big {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .side-card h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #0b1a33;
            margin-bottom: 4px;
        }

        .side-card p {
            color: #64748b;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .side-card .contact {
            color: #1e3a6b;
